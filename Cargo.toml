[package]
name = "properdim-rust"
version = "1.4.6"
edition = "2021"
authors = ["Kevin Stanislawski (original C#)", "s13mjl (Rust port)"]
description = "Rust + pure Win32/GDI port of ProperDim — a Windows screen dimmer"
license = "GPL-3.0-or-later"

[[bin]]
name = "ProperDim"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
